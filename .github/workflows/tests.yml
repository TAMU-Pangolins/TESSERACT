name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.21"
          python-version: "3.11"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --no-dev
      - name: Install verified HFB tables for physics tests
        run: uv run --no-sync python download_data.py --dest data/densities/level-densities-hfb
      - name: Run regression and physics tests
        env:
          MPLBACKEND: Agg
        run: uv run --no-sync python -m unittest discover -s tests -v
      - name: Check batch script syntax
        run: bash -n run_ratesmc_batches.sh
