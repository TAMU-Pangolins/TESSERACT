name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    outputs:
      documentation_changed: ${{ steps.changes.outputs.required }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check documentation inputs
        id: changes
        run: python3 .github/scripts/documentation_changes.py
      - name: Install uv and Python
        if: steps.changes.outputs.required == 'true'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.21"
          python-version: "3.11"
          enable-cache: true
      - name: Install locked dependencies
        if: steps.changes.outputs.required == 'true'
        run: uv sync --locked --extra docs --no-dev
      - name: Build the documentation with strict checks
        if: steps.changes.outputs.required == 'true'
        env:
          DOCS_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          DOCS_REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: uv run --no-sync mkdocs build --strict
      - name: Upload the Pages artifact
        if: steps.changes.outputs.required == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy documentation
    if: needs.build.outputs.documentation_changed == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: documentation-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy the documentation artifact
        id: deployment
        uses: actions/deploy-pages@v4
