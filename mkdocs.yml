site_name: TESSERACT
site_description: Nuclear reaction rate tooling and utilities.
site_url: ""
repo_url: ""
theme:
    name: material
    language: en
    features:
        - navigation.instant
        - navigation.sections
        - navigation.top
        - search.highlight
        - search.suggest
plugins:
    - search
    - mkdocstrings:
          handlers:
              python:
                  options:
                      show_source: true
                      show_root_heading: true
                      show_root_toc_entry: false
                      docstring_style: numpy
                      separate_signature: true
                      show_signature_annotations: true
                      group_by_category: true
                      show_category_heading: true
                      members_order: source
markdown_extensions:
    - admonition
    - footnotes
    - tables
    - pymdownx.arithmatex:
          generic: true
    - toc:
          permalink: true
extra_javascript:
    - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
    - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
    - javascripts/katex.js
extra_css:
    - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css
nav:
    - Home: index.md
    - Project Spec: project-specification.md
    - Concepts: concepts.md
    - Spacing Models: spacing-models.md
    - Data & Inputs: data-inputs.md
    - Workflows: workflows.md
    - Examples: examples.md
    - API Reference:
          - Overview: api/package.md
          - Physics Core:
                - Resonance: api/resonance.md
                - Rates: api/rates.md
                - Physics: api/physics.md
                - Sampling: api/sampling.md
          - Generation:
                - Generator: api/generator.md
                - Model: api/model.md
                - RatesMC Export: api/ratesmc_export.md
          - Data & Utilities:
                - HFB Adapter: api/hfb_adapter.md
                - Config: api/config.md
                - Read Qvals: api/read_qvals.md
                - Lab To CM: api/lab_to_cm.md
                - Plotting: api/plotting.md
    - Usage:
          - Diagnostic Plots: usage/diagnostic-plots.md
